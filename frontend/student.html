<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Practice - Educational Learning Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #E0E7FF 100%);
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce {
            animation: bounce 0.6s infinite;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #93C5FD; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #60A5FA; }
    </style>
</head>
<body class="h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🎓</span>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">Student Practice</h1>
                        <p class="text-sm text-gray-500">Interactive Math Learning</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <span id="welcomeText" class="text-gray-600 font-medium">Welcome!</span>
                    <a href="index.html" class="flex items-center gap-1 text-gray-500 hover:text-gray-700 font-medium text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg transition-colors">
                        ← Back to Home
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 overflow-hidden flex flex-col">
        <div class="flex-1 bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
            
            <!-- Messages Container -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 bg-gradient-to-b from-gray-50 to-white">
                <!-- Messages will be added here by JavaScript -->
            </div>
            
            <!-- Input Area -->
            <div class="border-t border-gray-200 p-4 bg-white">
                <div class="flex gap-2">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Connecting to agent..."
                        disabled
                        class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100 disabled:cursor-not-allowed"
                    >
                    <button
                        id="sendButton"
                        class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white px-6 py-3 rounded-xl font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg"
                    >
                        Send
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        // Get user name from URL
        const userName = getUrlParam('name') || 'Student';
        document.getElementById('welcomeText').textContent = `Welcome, ${userName}!`;
        
        // Welcome message
        const welcomeMessage = `Hey ${userName}! 👋 Ready to practice some math?

I can help you practice:
• Fractions
• Decimals
• Percentages
• Geometry
• Algebra

What topic would you like to practice today? And how many questions? (I suggest 3 or 5 to start!)`;

        // Initialize chat
        const chat = new ChatInterface(
            'student_flow',
            userName.toLowerCase().replace(/\s+/g, '_'),
            document.getElementById('messagesContainer'),
            document.getElementById('messageInput'),
            document.getElementById('sendButton'),
            welcomeMessage
        );
    </script>
</body>
</html>
